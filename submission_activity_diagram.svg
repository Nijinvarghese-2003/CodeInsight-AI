<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 860" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827" />
    </marker>
    <!-- Shadow Filter -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- Outer Border / Card -->
  <rect x="15" y="15" width="590" height="830" rx="14" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />

  <!-- Diagram Title -->
  <text x="310" y="48" text-anchor="middle" font-size="18.5" font-weight="700" fill="#111827">
    Figure 6: Code Submission &amp; Evaluation Activity Diagram
  </text>

  <!-- Flow Connectors (Lines & Arrows) -->
  <!-- Start -> Node 1 -->
  <line x1="310" y1="88" x2="310" y2="114" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  
  <!-- Node 1 -> Node 2 -->
  <line x1="310" y1="162" x2="310" y2="188" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  
  <!-- Node 2 -> Node 3 -->
  <line x1="310" y1="236" x2="310" y2="262" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  
  <!-- Node 3 -> Service Node (Purple) -->
  <line x1="310" y1="310" x2="310" y2="336" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  
  <!-- Service Node -> Decision Diamond -->
  <line x1="310" y1="390" x2="310" y2="422" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  
  <!-- Decision -> Error Box (No) -->
  <line x1="365" y1="460" x2="415" y2="460" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="388" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">No</text>
  
  <!-- Error Box -> Loopback to Monaco Editor -->
  <path d="M 500 435 L 500 212 L 435 212" fill="none" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  
  <!-- Decision -> Run Gemini & Plagiarism (Yes) -->
  <line x1="310" y1="498" x2="310" y2="530" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="325" y="516" font-size="12" font-weight="700" fill="#111827">Yes</text>
  
  <!-- AI / Plagiarism -> Store in DB -->
  <line x1="310" y1="580" x2="310" y2="606" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Store in DB -> Show Results -->
  <line x1="310" y1="654" x2="310" y2="680" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />
  
  <!-- Show Results -> End State -->
  <line x1="310" y1="728" x2="310" y2="760" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />


  <!-- ================= 1. Initial State (Black circle) ================= -->
  <circle cx="310" cy="76" r="13" fill="#111827" />


  <!-- ================= 2. Yellow Action Nodes ================= -->
  <!-- Select Assignment in Lab -->
  <g filter="url(#subtle-shadow)">
    <rect x="200" y="116" width="220" height="46" rx="10" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />
    <text x="310" y="144" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">Select Assignment in Lab</text>
  </g>

  <!-- Write Solution in Monaco Editor -->
  <g filter="url(#subtle-shadow)">
    <rect x="185" y="190" width="250" height="46" rx="10" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />
    <text x="310" y="218" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">Write Solution in Monaco Editor</text>
  </g>

  <!-- Click Submit Code -->
  <g filter="url(#subtle-shadow)">
    <rect x="200" y="264" width="220" height="46" rx="10" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />
    <text x="310" y="292" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">Click Submit Code</text>
  </g>


  <!-- ================= 3. Purple Service Node ================= -->
  <g filter="url(#subtle-shadow)">
    <rect x="160" y="338" width="300" height="52" rx="10" fill="#E9D5FF" stroke="#9333EA" stroke-width="1.5" />
    <text x="310" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">Execute Code in Judge0 Sandbox</text>
    <text x="310" y="378" text-anchor="middle" font-size="11.5" font-weight="500" fill="#4B5563">(Remote Compiler &amp; Sandbox Service)</text>
  </g>


  <!-- ================= 4. Decision Diamond ================= -->
  <g filter="url(#subtle-shadow)">
    <polygon points="310,422 365,460 310,498 255,460" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5" />
    <text x="310" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">Tests</text>
    <text x="310" y="471" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">Passed?</text>
  </g>


  <!-- ================= 5. Error Node (Red/Pink) ================= -->
  <g filter="url(#subtle-shadow)">
    <rect x="415" y="435" width="170" height="50" rx="10" fill="#FECDD3" stroke="#E11D48" stroke-width="1.5" />
    <text x="500" y="457" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">Display Compilation /</text>
    <text x="500" y="473" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">Test Case Errors</text>
  </g>


  <!-- ================= 6. Success Green Nodes ================= -->
  <!-- Run Gemini AI Analysis & Plagiarism Check -->
  <g filter="url(#subtle-shadow)">
    <rect x="145" y="532" width="330" height="48" rx="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5" />
    <text x="310" y="561" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Run Gemini AI Analysis &amp; Plagiarism Check</text>
  </g>

  <!-- Store Evaluation & Metrics in MongoDB -->
  <g filter="url(#subtle-shadow)">
    <rect x="160" y="606" width="300" height="48" rx="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5" />
    <text x="310" y="635" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Store Evaluation &amp; Metrics in MongoDB</text>
  </g>

  <!-- Display Results, AI Feedback & Score -->
  <g filter="url(#subtle-shadow)">
    <rect x="165" y="680" width="290" height="48" rx="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5" />
    <text x="310" y="709" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Display Results, AI Feedback &amp; Score</text>
  </g>


  <!-- ================= 7. Final State (Bullseye) ================= -->
  <circle cx="310" cy="775" r="14" fill="none" stroke="#111827" stroke-width="2" />
  <circle cx="310" cy="775" r="9" fill="#111827" />

</svg>
