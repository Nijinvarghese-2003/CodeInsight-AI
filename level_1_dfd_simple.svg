<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 820" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827" />
    </marker>
    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="620" height="790" rx="14" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />

  <!-- Title -->
  <text x="325" y="55" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">
    Figure 4: Level 1 Data Flow Diagram
  </text>

  <!-- ================= CONNECTORS / DATA FLOWS ================= -->

  <!-- Student -> 1.0 (Credentials) -->
  <path d="M 90 350 L 90 200 L 230 200" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="160" y="190" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937">Credentials</text>

  <!-- 1.0 -> Student (Auth Status) -->
  <path d="M 285 245 L 285 285 L 120 285 L 120 350" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="195" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937">Auth Status</text>
  <text x="195" y="283" text-anchor="middle" font-size="10.5" font-weight="500" fill="#4B5563">(User Info / JWT)</text>

  <!-- 1.0 -> D1 (Verify Credentials) -->
  <path d="M 360 200 L 490 200" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="425" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Verify</text>
  <text x="425" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Credentials</text>

  <!-- Student -> 2.0 (Dashboard / Lab Request) -->
  <path d="M 140 405 L 230 405" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="185" y="388" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Dashboard</text>
  <text x="185" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Request</text>

  <!-- 2.0 -> Student (Dashboard / Lab Data) -->
  <path d="M 230 445 L 140 445" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="185" y="462" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Dashboard</text>
  <text x="185" y="475" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Data</text>

  <!-- 2.0 -> D1 (Auth Token Verification) -->
  <path d="M 360 425 L 555 425 L 555 250" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Student -> 3.0 (Code Submission) -->
  <path d="M 90 460 L 90 640 L 230 640" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="160" y="630" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Code</text>
  <text x="160" y="643" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Submission</text>

  <!-- 3.0 -> Student (Evaluation & Results) -->
  <path d="M 230 675 L 65 675 L 65 460" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="145" y="692" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Evaluation &amp; AI Results</text>

  <!-- 3.0 -> D2 (Store / Retrieve Submission & Assignments) -->
  <path d="M 360 635 L 490 635" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="425" y="612" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2937">Store / Retrieve</text>
  <text x="425" y="625" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2937">Submissions</text>

  <!-- D2 -> 3.0 (Assignment Details & Test Cases) -->
  <path d="M 490 665 L 360 665" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="425" y="682" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2937">Assignment Data &amp;</text>
  <text x="425" y="695" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2937">Test Cases</text>


  <!-- ================= ENTITY (LEFT) ================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="350" width="100" height="110" rx="14" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="90" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Student /</text>
    <text x="90" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Faculty</text>
  </g>


  <!-- ================= PROCESSES (CENTER) ================= -->

  <!-- Process 1.0 (Yellow) -->
  <g filter="url(#shadow)">
    <rect x="230" y="145" width="130" height="100" rx="18" fill="#FEF08A" stroke="#EAB308" stroke-width="1.8" />
    <text x="295" y="185" text-anchor="middle" font-size="15" font-weight="800" fill="#713F12">1.0</text>
    <text x="295" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Authenticate</text>
    <text x="295" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">User</text>
  </g>

  <!-- Process 2.0 (Blue) -->
  <g filter="url(#shadow)">
    <rect x="230" y="375" width="130" height="100" rx="18" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.8" />
    <text x="295" y="415" text-anchor="middle" font-size="15" font-weight="800" fill="#1E3A8A">2.0</text>
    <text x="295" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Dashboard</text>
    <text x="295" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Access</text>
  </g>

  <!-- Process 3.0 (Red/Coral) -->
  <g filter="url(#shadow)">
    <rect x="230" y="605" width="130" height="100" rx="18" fill="#FECDD3" stroke="#F43F5E" stroke-width="1.8" />
    <text x="295" y="645" text-anchor="middle" font-size="15" font-weight="800" fill="#881337">3.0</text>
    <text x="295" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Manage</text>
    <text x="295" y="686" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">Submissions</text>
  </g>


  <!-- ================= DATA STORES (RIGHT CYLINDERS) ================= -->

  <!-- D1 Database (Top Right Cylinder) -->
  <g filter="url(#shadow)">
    <!-- Cylinder Body -->
    <path d="M 490 170 L 490 230 A 60 16 0 0 0 610 230 L 610 170 Z" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.6" />
    <!-- Cylinder Top Cap -->
    <ellipse cx="550" cy="170" rx="60" ry="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <!-- Text -->
    <text x="550" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="#14532D">D1</text>
    <text x="550" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">MongoDB</text>
    <text x="550" y="232" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">(Users DB)</text>
  </g>

  <!-- D2 Database (Bottom Right Cylinder) -->
  <g filter="url(#shadow)">
    <!-- Cylinder Body -->
    <path d="M 490 605 L 490 665 A 60 16 0 0 0 610 665 L 610 605 Z" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.6" />
    <!-- Cylinder Top Cap -->
    <ellipse cx="550" cy="605" rx="60" ry="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <!-- Text -->
    <text x="550" y="637" text-anchor="middle" font-size="13" font-weight="800" fill="#14532D">D2</text>
    <text x="550" y="653" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">MongoDB</text>
    <text x="550" y="667" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">(Labs &amp; Submissions)</text>
  </g>

</svg>
