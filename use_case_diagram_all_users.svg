<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 780" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="920" height="750" rx="16" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Diagram Title -->
  <text x="475" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">
    Figure 2: Use Case Diagram of CodeInsight-AI
  </text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="300" y="100" width="350" height="620" rx="14" fill="#F8FAFC" stroke="#334155" stroke-width="1.8" />
  <text x="475" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#1D4ED8">
    CodeInsight-AI System
  </text>


  <!-- ================= ACTOR LINES ================= -->

  <!-- Student Lines -->
  <!-- Student (120, 240) -> Use Cases -->
  <line x1="150" y1="240" x2="330" y2="175" stroke="#1E293B" stroke-width="1.5" /> <!-- Login / Authentication -->
  <line x1="150" y1="240" x2="330" y2="235" stroke="#1E293B" stroke-width="1.5" /> <!-- View Labs & Assignments -->
  <line x1="150" y1="240" x2="330" y2="295" stroke="#1E293B" stroke-width="1.5" /> <!-- Write & Submit Code -->
  <line x1="150" y1="240" x2="330" y2="355" stroke="#1E293B" stroke-width="1.5" /> <!-- Run Sandbox Tests -->
  <line x1="150" y1="240" x2="330" y2="415" stroke="#1E293B" stroke-width="1.5" /> <!-- View AI Insights & Results -->

  <!-- Faculty Lines -->
  <!-- Faculty (120, 520) -> Use Cases -->
  <line x1="150" y1="520" x2="330" y2="175" stroke="#1E293B" stroke-width="1.5" /> <!-- Login / Authentication -->
  <line x1="150" y1="520" x2="330" y2="235" stroke="#1E293B" stroke-width="1.5" /> <!-- View Labs & Assignments -->
  <line x1="150" y1="520" x2="330" y2="415" stroke="#1E293B" stroke-width="1.5" /> <!-- View AI Insights & Results -->
  <line x1="150" y1="520" x2="330" y2="475" stroke="#1E293B" stroke-width="1.5" /> <!-- Create & Manage Assignments -->
  <line x1="150" y1="520" x2="330" y2="535" stroke="#1E293B" stroke-width="1.5" /> <!-- Review Submissions & Plagiarism -->

  <!-- Admin Lines -->
  <!-- Admin (830, 400) -> Use Cases -->
  <line x1="800" y1="400" x2="620" y2="175" stroke="#1E293B" stroke-width="1.5" /> <!-- Login / Authentication -->
  <line x1="800" y1="400" x2="620" y2="415" stroke="#1E293B" stroke-width="1.5" /> <!-- View AI Insights & Results -->
  <line x1="800" y1="400" x2="620" y2="595" stroke="#1E293B" stroke-width="1.5" /> <!-- Manage Departments & Labs -->
  <line x1="800" y1="400" x2="620" y2="655" stroke="#1E293B" stroke-width="1.5" /> <!-- Manage User Pre-approvals -->


  <!-- ================= USE CASE OVALS ================= -->

  <!-- 1. Login / Authentication -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="175" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="180" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Login / Authentication</text>
  </g>

  <!-- 2. View Labs & Assignments -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="235" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="240" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">View Labs &amp; Assignments</text>
  </g>

  <!-- 3. Write & Submit Code -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="295" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="300" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Write &amp; Submit Code</text>
  </g>

  <!-- 4. Run Sandbox Tests -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="355" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="360" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Run Sandbox Tests</text>
  </g>

  <!-- 5. View AI Insights & Results -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="415" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="420" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">View AI Insights &amp; Results</text>
  </g>

  <!-- 6. Create & Manage Assignments -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="475" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="480" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Create &amp; Manage Assignments</text>
  </g>

  <!-- 7. Review Submissions & Plagiarism -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="535" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="540" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Review Submissions &amp; Plagiarism</text>
  </g>

  <!-- 8. Manage Departments & Labs -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="595" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="600" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Manage Departments &amp; Labs</text>
  </g>

  <!-- 9. Manage User Pre-approvals -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="655" rx="140" ry="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <text x="475" y="660" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Manage User Pre-approvals</text>
  </g>


  <!-- ================= ACTORS (STICK FIGURES) ================= -->

  <!-- 1. Student Actor (Top Left) -->
  <g transform="translate(120, 200)">
    <!-- Head -->
    <circle cx="0" cy="0" r="14" fill="#DCFCE7" stroke="#1E293B" stroke-width="2" />
    <!-- Body -->
    <line x1="0" y1="14" x2="0" y2="50" stroke="#1E293B" stroke-width="2" />
    <!-- Arms -->
    <line x1="-22" y1="28" x2="22" y2="28" stroke="#1E293B" stroke-width="2" />
    <!-- Legs -->
    <line x1="0" y1="50" x2="-18" y2="82" stroke="#1E293B" stroke-width="2" />
    <line x1="0" y1="50" x2="18" y2="82" stroke="#1E293B" stroke-width="2" />
    <!-- Label -->
    <text x="0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Student</text>
  </g>

  <!-- 2. Faculty Actor (Bottom Left) -->
  <g transform="translate(120, 480)">
    <!-- Head -->
    <circle cx="0" cy="0" r="14" fill="#DCFCE7" stroke="#1E293B" stroke-width="2" />
    <!-- Body -->
    <line x1="0" y1="14" x2="0" y2="50" stroke="#1E293B" stroke-width="2" />
    <!-- Arms -->
    <line x1="-22" y1="28" x2="22" y2="28" stroke="#1E293B" stroke-width="2" />
    <!-- Legs -->
    <line x1="0" y1="50" x2="-18" y2="82" stroke="#1E293B" stroke-width="2" />
    <line x1="0" y1="50" x2="18" y2="82" stroke="#1E293B" stroke-width="2" />
    <!-- Label -->
    <text x="0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Faculty</text>
  </g>

  <!-- 3. Admin Actor (Right) -->
  <g transform="translate(830, 360)">
    <!-- Head -->
    <circle cx="0" cy="0" r="14" fill="#DCFCE7" stroke="#1E293B" stroke-width="2" />
    <!-- Body -->
    <line x1="0" y1="14" x2="0" y2="50" stroke="#1E293B" stroke-width="2" />
    <!-- Arms -->
    <line x1="-22" y1="28" x2="22" y2="28" stroke="#1E293B" stroke-width="2" />
    <!-- Legs -->
    <line x1="0" y1="50" x2="-18" y2="82" stroke="#1E293B" stroke-width="2" />
    <line x1="0" y1="50" x2="18" y2="82" stroke="#1E293B" stroke-width="2" />
    <!-- Label -->
    <text x="0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Admin</text>
  </g>

</svg>
