<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 900" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827" />
    </marker>
    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="720" height="870" rx="14" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />

  <!-- Diagram Title -->
  <text x="375" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">
    Figure 1: System Architecture of CodeInsight-AI
  </text>

  <!-- ================= CONNECTORS / FLOW LINES ================= -->

  <!-- Top Flow: Presentation -> Routing -->
  <line x1="240" y1="280" x2="270" y2="280" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Top Flow: Routing -> Backend Layer -->
  <line x1="470" y1="280" x2="500" y2="280" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Feedback line: Backend -> Routing (Dashed) -->
  <path d="M 500 350 L 470 350" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <!-- Flow: Backend Layer -> Service Layer -->
  <path d="M 560 480 L 560 540 L 220 540 L 220 580" fill="none" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Flow: Backend Layer -> Data Layer -->
  <path d="M 640 480 L 640 580" fill="none" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Flow: Service Layer -> Data Layer -->
  <line x1="390" y1="710" x2="450" y2="710" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Feedback: Service Layer -> Presentation Layer -->
  <path d="M 120 590 L 80 590 L 80 490" fill="none" stroke="#111827" stroke-width="1.75" marker-end="url(#arrow)" />


  <!-- ================= TOP LAYER 1: Presentation Layer (React Frontend) ================= -->
  <g filter="url(#shadow)">
    <!-- Layer Header -->
    <text x="140" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">Presentation Layer</text>
    <text x="140" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">(React Frontend)</text>

    <!-- Card -->
    <rect x="40" y="140" width="200" height="340" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />

    <!-- React Icon / Graphic -->
    <g transform="translate(140, 200)">
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#0284C7" stroke-width="2" transform="rotate(0)" />
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#0284C7" stroke-width="2" transform="rotate(60)" />
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#0284C7" stroke-width="2" transform="rotate(120)" />
      <circle cx="0" cy="0" r="4.5" fill="#0284C7" />
    </g>

    <!-- Card Title -->
    <text x="140" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">React App</text>
    <text x="140" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(Tailwind CSS / Vite)</text>

    <!-- Bullet Points -->
    <text x="60" y="325" font-size="12.5" font-weight="500" fill="#1F2937">• Pages (Student/Faculty)</text>
    <text x="60" y="355" font-size="12.5" font-weight="500" fill="#1F2937">• Monaco Code Editor</text>
    <text x="60" y="385" font-size="12.5" font-weight="500" fill="#1F2937">• Test Execution Views</text>
    <text x="60" y="415" font-size="12.5" font-weight="500" fill="#1F2937">• AI Feedback UI</text>
    <text x="60" y="445" font-size="12.5" font-weight="500" fill="#1F2937">• Responsive UI/UX</text>
  </g>


  <!-- ================= TOP LAYER 2: Routing Layer (React Router) ================= -->
  <g filter="url(#shadow)">
    <!-- Layer Header -->
    <text x="370" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">Routing Layer</text>
    <text x="370" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#8B5CF6">(React Router &amp; Axios)</text>

    <!-- Card -->
    <rect x="270" y="140" width="200" height="340" rx="14" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.5" />

    <!-- Route Icon -->
    <g transform="translate(370, 200)">
      <circle cx="-16" cy="12" r="7" fill="#4C1D95" />
      <circle cx="-16" cy="-12" r="7" fill="#4C1D95" />
      <circle cx="16" cy="0" r="8" fill="#7C3AED" />
      <path d="M -16 12 C 0 12, 0 0, 16 0" fill="none" stroke="#4C1D95" stroke-width="3" />
      <path d="M -16 -12 C 0 -12, 0 0, 16 0" fill="none" stroke="#4C1D95" stroke-width="3" />
    </g>

    <!-- Card Title -->
    <text x="370" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Client-side Routing</text>
    <text x="370" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">&amp; API Interceptors</text>

    <!-- Bullet Points -->
    <text x="290" y="325" font-size="12.5" font-weight="500" fill="#1F2937">• Public Routes</text>
    <text x="290" y="355" font-size="12.5" font-weight="500" fill="#1F2937">• Protected Routes</text>
    <text x="290" y="385" font-size="12.5" font-weight="500" fill="#1F2937">• Role-Based Access</text>
    <text x="290" y="415" font-size="12.5" font-weight="500" fill="#1F2937">• JWT Headers Manager</text>
    <text x="290" y="445" font-size="12.5" font-weight="500" fill="#1F2937">• Navigation Guard</text>
  </g>


  <!-- ================= TOP LAYER 3: Authentication & API Layer (Express.js) ================= -->
  <g filter="url(#shadow)">
    <!-- Layer Header -->
    <text x="600" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#15803D">Backend &amp; API Layer</text>
    <text x="600" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">(Express.js &amp; Node)</text>

    <!-- Card -->
    <rect x="500" y="140" width="200" height="340" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />

    <!-- Server / Shield Icon -->
    <g transform="translate(600, 200)">
      <rect x="-20" y="-18" width="40" height="36" rx="6" fill="#16A34A" />
      <circle cx="-10" cy="-6" r="2.5" fill="#DCFCE7" />
      <circle cx="-10" cy="6" r="2.5" fill="#DCFCE7" />
      <line x1="0" y1="-6" x2="12" y2="-6" stroke="#DCFCE7" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="6" x2="12" y2="6" stroke="#DCFCE7" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Card Title -->
    <text x="600" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Express REST API</text>
    <text x="600" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">&amp; Auth Middleware</text>

    <!-- Bullet Points -->
    <text x="520" y="325" font-size="12.5" font-weight="500" fill="#1F2937">• Register &amp; Login</text>
    <text x="520" y="355" font-size="12.5" font-weight="500" fill="#1F2937">• JWT Verification</text>
    <text x="520" y="385" font-size="12.5" font-weight="500" fill="#1F2937">• Pre-Approval Check</text>
    <text x="520" y="415" font-size="12.5" font-weight="500" fill="#1F2937">• Assignment Routes</text>
    <text x="520" y="445" font-size="12.5" font-weight="500" fill="#1F2937">• Submission Controller</text>
  </g>


  <!-- ================= BOTTOM LAYER 1: Application Service Layer ================= -->
  <g filter="url(#shadow)">
    <!-- Layer Header -->
    <text x="255" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">Application Service Layer</text>
    <text x="255" y="581" text-anchor="middle" font-size="12" font-weight="600" fill="#D97706">(Judge0 &amp; Gemini AI Services)</text>

    <!-- Card -->
    <rect x="120" y="595" width="270" height="240" rx="14" fill="#FEFCE8" stroke="#FDE047" stroke-width="1.5" />

    <!-- AI / Execution Icon -->
    <g transform="translate(175, 640)">
      <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#F59E0B" />
      <path d="M -8 -4 L -3 0 L -8 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="0" y1="4" x2="8" y2="4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Card Subheader -->
    <text x="270" y="635" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Code Evaluation</text>
    <text x="270" y="652" text-anchor="middle" font-size="13" font-weight="600" fill="#854D0E">&amp; AI Analysis Engine</text>

    <!-- Bullet Points -->
    <text x="145" y="695" font-size="12.5" font-weight="500" fill="#1F2937">• Judge0 Sandboxed Code Execution</text>
    <text x="145" y="725" font-size="12.5" font-weight="500" fill="#1F2937">• Automated Test Case Validation</text>
    <text x="145" y="755" font-size="12.5" font-weight="500" fill="#1F2937">• Gemini LLM Feedback &amp; Review</text>
    <text x="145" y="785" font-size="12.5" font-weight="500" fill="#1F2937">• Plagiarism &amp; Code Similarity Matrix</text>
  </g>


  <!-- ================= BOTTOM LAYER 2: Data Layer (MongoDB) ================= -->
  <g filter="url(#shadow)">
    <!-- Layer Header -->
    <text x="585" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">Data Layer</text>
    <text x="585" y="581" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">(MongoDB Database)</text>

    <!-- Card -->
    <rect x="450" y="595" width="270" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />

    <!-- DB Stack Icon -->
    <g transform="translate(500, 640)">
      <ellipse cx="0" cy="-10" rx="16" ry="5" fill="#2563EB" />
      <path d="M -16 -10 L -16 0 A 16 5 0 0 0 16 0 L 16 -10 Z" fill="#3B82F6" />
      <path d="M -16 0 L -16 10 A 16 5 0 0 0 16 10 L 16 0 Z" fill="#1D4ED8" />
    </g>

    <!-- Card Subheader -->
    <text x="600" y="635" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">MongoDB Atlas</text>
    <text x="600" y="652" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(Mongoose ODM Models)</text>

    <!-- Bullet Points -->
    <text x="475" y="695" font-size="12.5" font-weight="500" fill="#1F2937">• Users &amp; PreApproved Collections</text>
    <text x="475" y="725" font-size="12.5" font-weight="500" fill="#1F2937">• Departments, Courses &amp; Labs</text>
    <text x="475" y="755" font-size="12.5" font-weight="500" fill="#1F2937">• Assignments &amp; Test Cases</text>
    <text x="475" y="785" font-size="12.5" font-weight="500" fill="#1F2937">• Submissions &amp; Plagiarism Logs</text>
  </g>

</svg>
