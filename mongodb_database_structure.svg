<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 780" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827" />
    </marker>
    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="520" height="750" rx="14" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />

  <!-- Diagram Title -->
  <text x="275" y="48" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">
    Figure 7: MongoDB Database Structure
  </text>

  <!-- Flow Connectors -->
  <!-- Box 1 -> Box 2 -->
  <line x1="275" y1="125" x2="275" y2="155" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Box 2 -> Box 3 -->
  <line x1="275" y1="240" x2="275" y2="270" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Box 3 -> Box 4 -->
  <line x1="275" y1="325" x2="275" y2="355" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow)" />


  <!-- ================= 1. Top Box (Blue): Collection: users ================= -->
  <g filter="url(#shadow)">
    <rect x="75" y="75" width="400" height="50" rx="10" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5" />
    <text x="275" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">Collection: users</text>
    <text x="275" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">(Document ID: {_id})</text>
  </g>


  <!-- ================= 2. Second Box (Green): Document: {_id} ================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="160" width="470" height="78" rx="10" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1.5" />
    <!-- Header portion -->
    <text x="275" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532D">Document: {_id} (User Document)</text>
    <!-- Divider -->
    <line x1="50" y1="197" x2="500" y2="197" stroke="#86EFAC" stroke-width="1" />
    <!-- Fields -->
    <text x="275" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">
      <tspan font-weight="700">Fields:</tspan> name, email, role, department, isApproved, createdAt
    </text>
  </g>


  <!-- ================= 3. Third Box (Purple): Collection: submissions ================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="275" width="470" height="50" rx="10" fill="#F3E8FF" stroke="#C084FC" stroke-width="1.5" />
    <text x="275" y="298" text-anchor="middle" font-size="13.5" font-weight="700" fill="#581C87">Collection: submissions</text>
    <text x="275" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#6B21A8">(Referencing users &amp; assignments)</text>
  </g>


  <!-- ================= 4. Fourth Large Card: Documents: {submissionId} ================= -->
  <g filter="url(#shadow)">
    <!-- Container Body -->
    <rect x="45" y="360" width="460" height="285" rx="12" fill="#FEFCE8" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top Header Banner (Coral Red) -->
    <path d="M 45 372 A 12 12 0 0 1 57 360 L 493 360 A 12 12 0 0 1 505 372 L 505 405 L 45 405 Z" fill="#FECDD3" stroke="#F43F5E" stroke-width="1.5" />
    <text x="275" y="388" text-anchor="middle" font-size="14.5" font-weight="700" fill="#881337">
      Documents: {submissionId}
    </text>

    <!-- Schema Field Rows -->
    <g transform="translate(68, 430)">
      <!-- Row 1: assignment -->
      <text x="0" y="0" font-size="12.5" font-weight="700" fill="#1F2937">• assignment</text>
      <text x="145" y="0" font-size="12.5" font-weight="600" fill="#374151">: ObjectId (Ref: Assignment)</text>

      <!-- Row 2: student -->
      <text x="0" y="22" font-size="12.5" font-weight="700" fill="#1F2937">• student</text>
      <text x="145" y="22" font-size="12.5" font-weight="600" fill="#374151">: ObjectId (Ref: User)</text>

      <!-- Row 3: submittedLanguage -->
      <text x="0" y="44" font-size="12.5" font-weight="700" fill="#1F2937">• submittedLanguage</text>
      <text x="145" y="44" font-size="12.5" font-weight="600" fill="#374151">: String (c / cpp / java / python)</text>

      <!-- Row 4: code -->
      <text x="0" y="66" font-size="12.5" font-weight="700" fill="#1F2937">• code</text>
      <text x="145" y="66" font-size="12.5" font-weight="600" fill="#374151">: String (Source Code)</text>

      <!-- Row 5: status -->
      <text x="0" y="88" font-size="12.5" font-weight="700" fill="#1F2937">• status</text>
      <text x="145" y="88" font-size="12.5" font-weight="600" fill="#374151">: String (Accepted / Wrong Answer / Pending)</text>

      <!-- Row 6: testCaseResults -->
      <text x="0" y="110" font-size="12.5" font-weight="700" fill="#1F2937">• testCaseResults</text>
      <text x="145" y="110" font-size="12.5" font-weight="600" fill="#374151">: Array [{ passed, executionTime }]</text>

      <!-- Row 7: aiAnalysis -->
      <text x="0" y="132" font-size="12.5" font-weight="700" fill="#1F2937">• aiAnalysis</text>
      <text x="145" y="132" font-size="12.5" font-weight="600" fill="#374151">: Object { qualityScore, complexity }</text>

      <!-- Row 8: plagiarism -->
      <text x="0" y="154" font-size="12.5" font-weight="700" fill="#1F2937">• plagiarism</text>
      <text x="145" y="154" font-size="12.5" font-weight="600" fill="#374151">: Object { similarityScore, flagged }</text>

      <!-- Row 9: score -->
      <text x="0" y="176" font-size="12.5" font-weight="700" fill="#1F2937">• score</text>
      <text x="145" y="176" font-size="12.5" font-weight="600" fill="#374151">: Number</text>

      <!-- Row 10: createdAt -->
      <text x="0" y="198" font-size="12.5" font-weight="700" fill="#1F2937">• createdAt</text>
      <text x="145" y="198" font-size="12.5" font-weight="600" fill="#374151">: Timestamp (Date)</text>
    </g>
  </g>


  <!-- ================= 5. Bottom Dashed Callout Box ================= -->
  <g>
    <rect x="45" y="668" width="460" height="62" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4" />
    <text x="275" y="692" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1E293B">
      Each submission document references student and assignment
    </text>
    <text x="275" y="710" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1E293B">
      IDs, containing code execution metrics, test outputs, AI review
    </text>
    <text x="275" y="726" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1E293B">
      insights, and plagiarism scores.
    </text>
  </g>

</svg>
